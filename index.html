<!DOCTYPE html>
<html lang="it" data-color-mode="card" data-label-case="upper">
<head>
  <meta charset="UTF-8">
  <!-- Sicurezza: solo script e stili del sito stesso; rete solo verso i servizi di simboli previsti (vedi docs/SICUREZZA.md) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://static.arasaac.org https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/; connect-src 'self' https://api.arasaac.org https://static.arasaac.org https://api.mymemory.translated.net https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
  <meta name="referrer" content="no-referrer">
  <!-- Niente indicizzazione finché il tool non avrà un dominio proprio (ROADMAP, Tappa 10) -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PicSpeak Prova">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="PicSpeak – strumento gratuito di Comunicazione Aumentativa Alternativa">
  <title>PicSpeak Prova</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/anteprima.css">
</head>
<body>
  <p class="preview-banner">VERSIONE DI PROVA, non per l’uso quotidiano: usa il <a href="https://mcdepltestenv.github.io/picspeak/">sito ufficiale</a>.</p>
  <!-- Barra della modalità adulto (nascosta in modalità bambino) -->
  <div class="adult-bar" id="adult-bar" hidden>
    <span class="adult-badge" data-i18n-label="adultMode"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 7.5-1.9"/></svg> <span class="adult-badge-text" data-i18n="adultMode"></span><span class="adult-preview-text" data-i18n="zoomPreview"></span></span>
    <!-- Zoom delle tessere: visibile solo con le impostazioni sbloccate; mentre si regola, la pagina è in anteprima
         (identica a quella del bambino) fino al primo tocco fuori da questi pulsanti -->
    <div class="zoom-control" role="group" data-i18n-label="zoomTiles">
      <button type="button" class="zoom-btn" id="btn-zoom-out" data-i18n-label="zoomOut">−</button>
      <button type="button" class="zoom-value" id="btn-zoom-reset" data-i18n-label="zoomReset">100%</button>
      <button type="button" class="zoom-btn" id="btn-zoom-in" data-i18n-label="zoomIn">+</button>
    </div>
    <button type="button" class="adult-btn" id="btn-open-settings">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.4 10.1 L21.9 10.3 L21.9 13.7 L19.4 13.9 L18.5 15.9 L20.2 17.8 L17.8 20.2 L15.9 18.5 L13.9 19.4 L13.7 21.9 L10.3 21.9 L10.1 19.4 L8.1 18.5 L6.2 20.2 L3.8 17.8 L5.5 15.9 L4.6 13.9 L2.1 13.7 L2.1 10.3 L4.6 10.1 L5.5 8.1 L3.8 6.2 L6.2 3.8 L8.1 5.5 L10.1 4.6 L10.3 2.1 L13.7 2.1 L13.9 4.6 L15.9 5.5 L17.8 3.8 L20.2 6.2 L18.5 8.1Z"/><circle cx="12" cy="12" r="3"/></svg> <span class="adult-btn-text" data-i18n="settings"></span>
    </button>
    <button type="button" class="adult-btn adult-btn-primary" id="btn-exit-adult">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg> <span class="adult-btn-text long" data-i18n="backToCommunication"></span><span class="adult-btn-text short" data-i18n="done"></span>
    </button>
  </div>

  <!-- Striscia frase: i simboli scelti formano la frase -->
  <header class="sentence-bar">
    <ol class="sentence-strip" id="sentence-strip" aria-live="polite"></ol>
    <div class="sentence-actions">
      <!-- Previsione «solo suggerite»: torna alla scheda intera (visibile solo quando alcune tessere sono nascoste) -->
      <button type="button" class="action-btn action-show-all" id="btn-show-all" data-i18n-label="showAllTiles" hidden>
        <span class="action-icon"><svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
        <span class="action-text" data-i18n="showAllShort"></span>
      </button>
      <button type="button" class="action-btn action-speak" id="btn-speak" data-i18n-label="speakSentence">
        <span class="action-icon"><svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3.5v6h3L11 19z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></span>
      </button>
      <button type="button" class="action-btn" id="btn-backspace" data-i18n-label="deleteLast">
        <span class="action-icon"><svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9.5L3 12l6.5 7H21z"/><path d="m16.5 9.5-5 5"/><path d="m11.5 9.5 5 5"/></svg></span>
      </button>
      <button type="button" class="action-btn" id="btn-clear" data-i18n-label="clearSentence">
        <span class="action-icon"><svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
      </button>
    </div>
  </header>

  <!-- Barra di navigazione: freccia «su», percorso "HOME › cartella › pagina" e accesso adulto -->
  <nav class="page-nav">
    <!-- Freccia «su»: torna alla cartella da cui si è arrivati (nascosta nella Home) -->
    <button type="button" class="nav-up" id="btn-up" data-i18n-label="goUp" hidden>
      <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    </button>
    <h1 class="crumbs" id="crumbs">
      <button type="button" class="crumb crumb-home" id="btn-home" data-i18n-label="goHome">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></svg><span data-i18n="homeLabel"></span>
      </button>
      <span class="crumb-trail" id="crumb-trail"></span>
      <span class="crumb-sep"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
      <span class="crumb crumb-current" id="page-title"></span>
    </h1>
    <!-- Pulsanti rapidi (facoltativi): «Ops», «Aiuto» e frasi sempre raggiungibili, lette senza entrare nella frase -->
    <div class="quick-bar" id="quick-bar" hidden>
      <button type="button" class="quick-btn quick-oops" id="btn-oops" hidden>
        <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="quickOops"></span>
      </button>
      <div class="quick-phrases" id="quick-phrases"></div>
      <button type="button" class="quick-btn quick-help" id="btn-help" hidden>
        <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg><span data-i18n="quickHelp"></span>
      </button>
    </div>
    <!-- Nome del contesto acceso (facoltativo, Impostazioni › Previsione › Contesti): solo da leggere, non si tocca -->
    <span class="context-tag" id="context-tag" hidden></span>
    <!-- Tre puntini: tenere premuto 3 secondi apre il menu (Impostazioni con PIN, Crediti, Guida) -->
    <button type="button" class="lock-btn" id="btn-lock" data-i18n-label="lockHint">
      <span class="lock-icon"><svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg></span>
      <span class="lock-progress" aria-hidden="true"></span>
    </button>
  </nav>

  <!-- Area usata solo per la stampa delle schede (vuota sullo schermo) -->
  <div class="print-area" id="print-area" aria-hidden="true"></div>

  <!-- Avanzamento della pressione sui tre puntini: in cima allo schermo, mai sotto il dito -->
  <div class="hold-indicator" id="hold-indicator" hidden>
    <div class="hold-bar"></div>
    <p class="hold-hint" data-i18n="holdHint"></p>
  </div>

  <!-- Griglia dei simboli della pagina corrente -->
  <main class="symbol-grid" id="symbol-grid"></main>

  <!-- Impostazioni (solo modalità adulto) -->
  <section class="settings-screen" id="settings-screen" hidden aria-labelledby="settings-title">
    <header class="settings-header">
      <button type="button" class="adult-btn" id="btn-settings-back">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg> <span data-i18n="back"></span>
      </button>
      <h2 id="settings-title" data-i18n="settingsTitle"></h2>
    </header>
    <div class="settings-body" id="settings-body"></div>
  </section>

  <!-- Finestra per PIN e codice di recupero -->
  <dialog class="pin-dialog" id="pin-dialog"></dialog>

  <noscript>PicSpeak ha bisogno di JavaScript attivo per funzionare.</noscript>

  <!-- Script classici (nessun build, funziona anche aprendo il file con doppio clic) -->
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/security.js"></script>
  <script src="js/install.js"></script>
  <script src="js/kiosk.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/symbols.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/lexicon.js"></script>
  <script src="js/prediction-base.js"></script>
  <script src="js/predict.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/obf.js"></script>
  <script src="js/app.js"></script>
  <script src="js/adult.js"></script>
  <script src="js/settings-boards.js"></script>
  <script src="js/settings-contexts.js"></script>
  <script src="js/communication.js"></script>
  <script src="js/settings-backup.js"></script>
  <script src="js/print.js"></script>
  <script src="js/symbol-search.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/reorder.js"></script>
</body>
</html>
